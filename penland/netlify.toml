# Penland LLC corporate site — deploy as its own Netlify site.
#   Base directory:    penland
#   Build command:     (leave blank)
#   Publish directory: public
#
# This is a separate Netlify site from the Men's Alliance test site in the
# repository root. Both live in the same repo; each has its own base directory.

[build]
  publish = "public"

# ---------------------------------------------------------------------------
# Subdomain vanity URLs
# ---------------------------------------------------------------------------
# Add each subdomain as a domain alias in Netlify (Domain management → Add
# domain alias), then these rules send it to its canonical page on the apex.
#
# 301 (not 200) is deliberate: it keeps exactly one canonical URL per page, so
# there is one Privacy Policy URL and one SMS Terms URL for carrier review, and
# relative links never break. Carriers, crawlers, and link previews all follow
# 301s.
#
# If a subdomain must keep its own address bar instead, change status to 200 and
# add matching rules for /legal/* and /styles.css on that host.

[[redirects]]
  from = "https://matchlineup.penlandllc.com/*"
  to = "https://penlandllc.com/matchlineup/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://alabaster.penlandllc.com/*"
  to = "https://penlandllc.com/alabaster/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://properties.penlandllc.com/*"
  to = "https://penlandllc.com/properties/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://advisory.penlandllc.com/*"
  to = "https://penlandllc.com/advisory/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Short paths carriers and support agents can be handed verbatim
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/privacy"
  to = "/legal/privacy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/legal/terms.html"
  status = 301

[[redirects]]
  from = "/sms"
  to = "/legal/sms.html"
  status = 301

[[redirects]]
  from = "/legal"
  to = "/legal/privacy.html"
  status = 301

[[redirects]]
  from = "/support"
  to = "/#contact"
  status = 301
